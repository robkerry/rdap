name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Test
        run: go test ./...

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          NAME="rdap_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          EXT=""

          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            EXT=".exe"
          fi

          mkdir -p dist

          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" CGO_ENABLED=0 \
            go build \
              -trimpath \
              -ldflags="-s -w" \
              -o "dist/rdap${EXT}" \
              ./cmd/rdap

          cp README.md LICENSE dist/

          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            (cd dist && zip -q "../${NAME}.zip" "rdap${EXT}" README.md LICENSE)
          else
            (cd dist && tar -czf "../${NAME}.tar.gz" rdap README.md LICENSE)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rdap-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            rdap_*.tar.gz
            rdap_*.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rdap-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
